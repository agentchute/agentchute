name: ci

on:
  push:
    branches: [main, release/v2.5]
  pull_request:

jobs:
  go:
    name: go test + vet + build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          check-latest: true
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files needing gofmt:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...
      - name: go build
        run: go build ./...
      - name: conformance module (executable spec)
        run: cd conformance && go test ./...

  hub-integration:
    name: SSH hub integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          check-latest: true
      - name: real-sshd integration
        run: sh tools/sshd-test.sh

  shell:
    name: install.sh shellcheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck install.sh
        run: shellcheck -s sh install.sh
      - name: shellcheck tests/install_test.sh
        run: shellcheck -s sh tests/install_test.sh
      - name: shellcheck tests/upgrade_smoke.sh
        run: shellcheck -s sh tests/upgrade_smoke.sh
      - name: shellcheck tests/upgrade_hook_refresh_smoke.sh
        run: shellcheck -s sh tests/upgrade_hook_refresh_smoke.sh
      - name: run install_test.sh
        run: sh tests/install_test.sh

  upgrade-smoke:
    name: old-to-v2.5 upgrade rehearsal
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v2.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          check-latest: true
      - name: run upgrade smoke
        run: sh tests/upgrade_smoke.sh

  upgrade-hook-refresh-smoke:
    name: real-release hook/spec refresh rehearsal
    # Unlike upgrade-smoke (release/v2.5-only, wrappers=none — it never
    # installs a hook file, so it can't exercise refresh at all), this job
    # runs on every PR and main push: it's the CI-level proof, over a real
    # v1.0.0-tagged binary, that a stale hook and a pre-marker AGENTCHUTE.md
    # actually refresh across `agentchute setup`/`update` (2026-08-11
    # hook-refresh-reliability investigation, closing codex's CI-blind-spot
    # finding).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          check-latest: true
      - name: run upgrade hook-refresh smoke
        run: sh tests/upgrade_hook_refresh_smoke.sh
